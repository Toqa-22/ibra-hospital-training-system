<!DOCTYPE html>
<!--
  ============================================================================
  index.html — صفحة تسجيل الدخول
  ============================================================================
  الغرض: بوابة دخول موحّدة لكل صفحات النظام المحمية (register.html،
  waiting.html، dashboard.html، reports.html) — وهي الآن نقطة الدخول
  الرئيسية للنظام: لا يظهر أي محتوى آخر (لا شريط علوي، لا تنقّل) قبل نجاح
  تسجيل الدخول، فقط نموذج الدخول بمنتصف الصفحة.

  اسم المستخدم وكلمة المرور لا يُخزَّنان ولا يُقارَنان في كود الواجهة
  إطلاقاً — النموذج يستدعي دالة verify_admin_login() في قاعدة بيانات
  Supabase (راجع sql/add_admin_login.sql) التي تقارن كلمة المرور بتجزئتها
  (bcrypt عبر pgcrypto) داخل الخادم فقط، وتُرجع true/false فحسب دون أن يصل
  أي جزء من كلمة المرور المخزَّنة إلى المتصفح مطلقاً.

  عند نجاح الدخول، تُخزَّن جلسة محلية بسيطة (اسم المستخدم + وقت الدخول) في
  localStorage لمدة صلاحية محدودة (راجع AUTH_SESSION_HOURS في js/auth.js)،
  ثم يُعاد التوجيه لصفحة redirect المطلوبة أصلاً (أو register.html
  افتراضياً — صفحة تسجيل المتدربين هي الوجهة الرئيسية للنظام بعد الدخول).

  كل الصفحات المحمية الأربع (register.html، waiting.html، dashboard.html،
  reports.html) تتحقق من هذه الجلسة عبر سكربت حارس (guard) في أعلى <head>
  الخاص بكل منها، ويُعيد توجيه أي زائر غير مسجَّل دخوله مباشرة إلى هذه
  الصفحة قبل عرض أي محتوى — فلا يظهر أي جزء من محتوى الصفحة المطلوبة قبل
  التحقق من صحة بيانات الدخول.

  بيانات الدخول الافتراضية المزروعة في قاعدة البيانات (sql/add_admin_login.sql):
    اسم المستخدم: Ibratsd
    كلمة المرور : ibra34312

  التبعيات (بترتيب التحميل الإلزامي في أسفل الصفحة):
    1) عميل Supabase JS من CDN
    2) js/config.js — بيانات الاتصال بمشروع Supabase
    3) js/ui.js       — يوفر showToast وsetButtonLoading
    4) js/supabase.js — يوفر عميل supabaseClient الجاهز لاستدعاء RPC
    5) js/auth.js     — منطق هذه الصفحة (نموذج الدخول) وإدارة الجلسة المحلية
  ============================================================================
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | نظام تسجيل وإدارة المتدربين</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <main class="auth-wrap">
    <form class="auth-card" id="loginForm" novalidate>

      <!-- شعار المستشفى كأيقونة أعلى نموذج الدخول (logo.png). إن تعذّر
           تحميله يستبدله handleLogoImgError() (معرّفة في js/ui.js) ببديل
           نصي "ت" تلقائياً بدل ترك مربع صورة مكسور -->
      <div class="auth-logo">
        <img src="assets/logo.png" alt="شعار المستشفى" onerror="handleLogoImgError(this)">
      </div>

      <h1>تسجيل الدخول</h1>
      <p class="auth-subtitle">وزارة الصحة - مستشفى إبراء<br>قسم التطوير والتوجيه المهني</p>

      <div class="auth-field">
        <label for="loginUsername">اسم المستخدم</label>
        <input type="text" id="loginUsername" autocomplete="username" placeholder="اسم المستخدم" required>
      </div>

      <div class="auth-field">
        <label for="loginPassword">كلمة المرور</label>
        <input type="password" id="loginPassword" autocomplete="current-password" placeholder="كلمة المرور" required>
      </div>

      <p class="auth-error" id="loginError"></p>

      <button type="submit" class="auth-submit" id="loginSubmitBtn">
        <span>دخول</span>
      </button>
    </form>
  </main>

  <!-- ==========================================================================
       ترتيب تحميل السكربتات مهم جداً: كل ملف يعتمد على ما قبله مباشرة.
       ========================================================================== -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
